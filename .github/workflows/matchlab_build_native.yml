name: MATCHLAB AZ - full HTML packaged Windows and Android

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'native/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'catalog.js'
      - 'featured_media.js'
      - 'coach_tactics.js'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'install.js'
      - 'server.py'
      - 'render.yaml'
      - '.github/workflows/matchlab_build_native.yml'

permissions:
  contents: read

jobs:
  windows-html:
    name: Windows HTML desktop exe + embedded resource smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create Windows brand icon
        shell: pwsh
        run: |
          python -m pip install pillow
          python native/branding/generate_icons.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish complete HTML Windows app
        shell: pwsh
        run: |
          dotnet publish native/packed-windows/MATCHLAB.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/packed-windows/out
      - name: Verify Windows executable and bundled assets
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'native/packed-windows/out/MATCHLAB_AZ.exe'
          if (!(Test-Path $exe)) { throw "Windows executable missing" }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "HTML embedded resource smoke failed: $($p.ExitCode)" }
          Write-Host "PASS Windows packaged HTML resources"
      - name: Launch Windows WebView2 and test actual HTML navigation
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'native/packed-windows/out/MATCHLAB_AZ.exe'
          $env:MATCHLAB_SMOKE_SCREENSHOT = Join-Path (Get-Location) 'native/packed-windows/windows_ui_smoke.png'
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru
          if (!$p.WaitForExit(65000)) { $p.Kill(); throw "Windows UI smoke timeout" }
          if ($p.ExitCode -ne 0) { throw "Windows UI navigation smoke failed: $($p.ExitCode)" }
          Write-Host "PASS actual Windows HTML WebView2 navigation"
      - name: Compile Windows desktop installer using Inno Setup
        shell: pwsh
        run: |
          $innoDir = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6'
          $iscc = Join-Path $innoDir 'ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc "native\packed-windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path 'native\packed-windows\installer-out\MATCHLAB_AZ_Setup_v0943.exe')) {
            throw "Installer not produced"
          }
      - name: Smoke test desktop install, Start icon, Apps registration, uninstall
        shell: pwsh
        run: |
          $setup = Join-Path (Get-Location) 'native\packed-windows\installer-out\MATCHLAB_AZ_Setup_v0943.exe'
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /TASKS=desktopicon' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MATCHLAB AZ\MATCHLAB_AZ.exe'
          if (!(Test-Path $exe)) { throw "EXE not present in Installed Apps location" }
          $self = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Installed application self-test failed" }
          $startLink = Join-Path ([Environment]::GetFolderPath('Programs')) 'MATCHLAB AZ.lnk'
          $desktopLink = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'MATCHLAB AZ.lnk'
          if (!(Test-Path $startLink)) { throw "Start menu shortcut not created" }
          if (!(Test-Path $desktopLink)) { throw "Desktop shortcut not created" }
          $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'MATCHLAB AZ*' })
          if ($entries.Count -ne 1) { throw "Apps > Installed Apps entry not found" }
          $uninstaller = Join-Path (Split-Path $exe) 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw "Uninstaller not installed" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Uninstaller did not remove EXE" }
          Write-Host 'PASS: Start menu, Desktop shortcut, Installed Apps registration, EXE self-test and uninstall'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Windows_Installer_v0943
          path: native/packed-windows/installer-out/MATCHLAB_AZ_Setup_v0943.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATCHLAB_AZ_v0942_Windows_UI_Screenshot
          path: native/packed-windows/windows_ui_smoke.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_HTML_Windows_v0942
          path: native/packed-windows/out/MATCHLAB_AZ.exe
          if-no-files-found: error
          retention-days: 30

  android-html:
    name: Android HTML apk + emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check native/packed/shell.js
          node --check service-worker.js
          node --check install.js
          python -m json.tool manifest.webmanifest > /dev/null
          python -m py_compile server.py hosting_server.py
          node --check app.js
          node --check catalog.js
          node --check coach_tactics.js
          node --check featured_media.js
      - name: Create launcher brand icons
        run: |
          python -m pip install pillow
          python native/branding/generate_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build HTML Android APK
        working-directory: native/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify full HTML bundle in APK
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          for f in index.html styles.css app.js catalog.js featured_media.js coach_tactics.js shell.css shell.js install.js service-worker.js manifest.webmanifest assets/icon.svg assets/pwa-192.png assets/pwa-512.png assets/pwa-512-maskable.png; do
            unzip -Z1 "$APK" | grep -Fx "assets/web/$f"
            bytes="$(unzip -p "$APK" "assets/web/$f" | wc -c)"
            test "$bytes" -gt 40
          done
          # Verify manifest advertises a real installed application and icon.
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee native/android/apk_badging.txt
          grep -q "application-label:'MATCHLAB AZ'" native/android/apk_badging.txt
          grep -q "launchable-activity: name='az.matchlab.mobile.MainActivity'" native/android/apk_badging.txt
          echo "PASS Android APK includes production HTML, installed app label and launcher activity"
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot emulator and verify native Android menu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r native/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n az.matchlab.mobile/.MainActivity
            sleep 13
            adb shell pm path az.matchlab.mobile
            adb shell pidof az.matchlab.mobile
            adb shell screencap -p /sdcard/matchlab_screen.png
            adb pull /sdcard/matchlab_screen.png native/android/matchlab_emulator.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml native/android/window.xml >/dev/null
            python -c "import xml.etree.ElementTree as E; r=E.parse('native/android/window.xml'); assert any('Tətbiq menyusu' in n.attrib.get('content-desc','') for n in r.iter()), 'native menu button inaccessible'"
            # Read the actual clickable menu's accessibility bounds.
            python -c 'import re,subprocess,xml.etree.ElementTree as E; root=E.parse("native/android/window.xml"); b=next(n.attrib["bounds"] for n in root.iter() if "Tətbiq menyusu" in n.attrib.get("content-desc","")); a=list(map(int,re.findall(r"\\d+",b))); x=(a[0]+a[2])//2; y=(a[1]+a[3])//2; print("Menu target:",x,y); subprocess.check_call(["adb","shell","input","tap",str(x),str(y)])'
            sleep 2
            adb shell uiautomator dump /sdcard/menu.xml >/dev/null
            adb pull /sdcard/menu.xml native/android/native_menu.xml >/dev/null
            python -c "import xml.etree.ElementTree as E; r=E.parse('native/android/native_menu.xml'); assert any('Ana ekrana qısayol' in n.attrib.get('text','') for n in r.iter()), 'native app menu not opened'"
            adb shell screencap -p /sdcard/matchlab_native_menu.png
            adb pull /sdcard/matchlab_native_menu.png native/android/matchlab_native_menu.png
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            # Tap in the HTML navigation, not the Android system gesture strip.
            python -c 'import re,subprocess; data=subprocess.check_output(["adb","shell","wm","size"],text=True); w,h=map(int,re.findall(r"(\\d+)x(\\d+)",data)[-1]); subprocess.check_call(["adb","shell","input","tap",str(w*92//100),str(h*91//100)])'
            sleep 2
            adb shell screencap -p /sdcard/matchlab_more.png
            adb pull /sdcard/matchlab_more.png native/android/matchlab_more.png
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee native/android/activity_state.txt
            grep -q 'az.matchlab.mobile' native/android/activity_state.txt
            adb shell pidof az.matchlab.mobile
            echo 'PASS Android app foreground, native menu and bundled HTML'
      - name: Upload Android emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_v0944_Android_Emulator_Screenshot
          path: |
            native/android/matchlab_emulator.png
            native/android/matchlab_more.png
            native/android/matchlab_native_menu.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATCHLAB_AZ_Android_Installed_App_v0944
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
