name: MATCHLAB AZ - Native Windows and Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'upgrade/**'
    paths:
      - 'native/**'
      - 'tests/**'
      - 'live_center.py'
      - 'server.py'
      - '.github/workflows/android_native_release.yml'
      - '.github/workflows/matchlab_build_native.yml'

concurrency:
  group: matchlab-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native:
    needs: android-native
    name: Windows x64 native app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate branded Windows icon
        run: |
          python -m pip install pillow
          python native/branding/generate_icons.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows Forms app
        shell: pwsh
        run: |
          dotnet publish native/windows-app/MATCHLABAZ.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/windows-app/out
      - name: Build native Windows setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler is missing" }
          & $compiler 'native/installer/MATCHLAB_AZ.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with $LASTEXITCODE" }
          if (-not (Test-Path 'native/windows-app/installer-out/MATCHLAB_AZ_Setup_0.9.54_x64.exe')) { throw "Installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Setup_v0954
          path: native/windows-app/installer-out/MATCHLAB_AZ_Setup_0.9.53_x64.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Windows_x64_v0954
          path: native/windows-app/out/MATCHLAB_AZ.exe
          if-no-files-found: error
          retention-days: 30

  android-native:
    name: Android native Java APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test live scores cache and stale labeling
        run: python -m unittest discover -s tests -p test_live_center_cache.py -v
      - name: Generate Android launcher icons
        run: |
          python -m pip install pillow
          python native/branding/generate_icons.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android UI
        working-directory: native/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Android_v0952
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Publish public GitHub Downloads
    needs: [android-native, windows-native]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MATCHLAB_AZ_Setup_v0954
          path: dist/setup
      - uses: actions/download-artifact@v4
        with:
          name: MATCHLAB_AZ_Windows_x64_v0954
          path: dist/portable
      - uses: actions/download-artifact@v4
        with:
          name: MATCHLAB_AZ_Android_v0952
          path: dist/android
      - name: Prepare clearly named public downloads and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          cp dist/setup/MATCHLAB_AZ_Setup_0.9.54_x64.exe public/MATCHLAB_AZ_Setup_0.9.54_x64.exe
          cp dist/portable/MATCHLAB_AZ.exe public/MATCHLAB_AZ_Portable_0.9.54_x64.exe
          APK="$(find dist/android -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" public/MATCHLAB_AZ_Android_0.9.52_TEST.apk
          (cd public && sha256sum *.exe *.apk > SHA256SUMS.txt)
          ls -lh public
      - name: Create or update GitHub Release with direct public assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.9.54"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" public/* --clobber
          else
            gh release create "$TAG" public/* \
              --title "MATCHLAB AZ v0.9.54 — Windows & Android" \
              --notes-file native/RELEASE_NOTES_v0954.md \
              --latest
          fi
          gh release view "$TAG" --json url,assets --jq '{url: .url, files: [.assets[].name]}'
