name: MATCHLAB AZ Native Android APK v0949
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/native-az-complete-main-20261103']
    paths:
      - 'native/android/**'
      - '.github/workflows/android_native_release.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native APK
        working-directory: native/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Native_Android_v0949
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
