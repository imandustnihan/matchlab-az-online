name: MATCHLAB AZ v0.9.46 native Android Studio project and APK
on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-fully-native-no-webview-v0946
    paths:
      - tools/export_android_studio.py
      - .github/workflows/android_studio_export.yml
      - native/android/**
      - native/branding/**
permissions:
  contents: read
jobs:
  export:
    name: Native Android Studio source and WebView-free APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK 35
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate launcher icons and export self-contained native project
        run: |
          python -m pip install pillow
          python native/branding/generate_icons.py
          python tools/export_android_studio.py export
      - name: Generate Gradle wrapper
        run: |
          gradle -p dist/MATCHLAB_AZ_Android_Studio_Native wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x dist/MATCHLAB_AZ_Android_Studio_Native/gradlew
      - name: Build native Android APK
        working-directory: dist/MATCHLAB_AZ_Android_Studio_Native
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Assert APK has native launcher and NO WebView or web assets
        run: |
          set -euo pipefail
          APK="dist/MATCHLAB_AZ_Android_Studio_Native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee dist/native_android_badging.txt
          grep -q "application-label:'MATCHLAB AZ'" dist/native_android_badging.txt
          grep -q "launchable-activity: name='az.matchlab.mobile.MainActivity'" dist/native_android_badging.txt
          if unzip -Z1 "$APK" | grep -E 'assets/web/|assets/.*\.html'; then
            echo "Unexpected HTML/WebView assets in native APK" >&2
            exit 1
          fi
          ! grep -R "import android.webkit\|WebView" dist/MATCHLAB_AZ_Android_Studio_Native/app/src/main/java
          echo "PASS native Java APK without browser engine"
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android emulator, navigate main screens and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r dist/MATCHLAB_AZ_Android_Studio_Native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n az.matchlab.mobile/.MainActivity
            sleep 10
            adb shell pidof az.matchlab.mobile
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml dist/native_ui.xml >/dev/null
            python -c 'import xml.etree.ElementTree as E; root=E.parse("dist/native_ui.xml"); t=[n.attrib.get("text","") for n in root.iter()]; assert any("MATCHLAB AZ" in v for v in t), t[:20]; assert any("Matçlar" in v for v in t), t[:20]'
            adb shell screencap -p /sdcard/matchlab_native.png
            adb pull /sdcard/matchlab_native.png dist/matchlab_native.png
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tee dist/native_activity_state.txt
            grep -q "az.matchlab.mobile" dist/native_activity_state.txt
            echo "PASS native app opened and foreground on Android emulator"
      - name: Package source ZIP
        run: python tools/export_android_studio.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Native_Android_Studio_Source_v0946
          path: dist/MATCHLAB_AZ_Android_Studio_Native_v0946.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHLAB_AZ_Native_Android_APK_v0946
          path: dist/MATCHLAB_AZ_Android_Studio_Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATCHLAB_AZ_Native_Android_Emulator_v0946
          path: dist/matchlab_native.png
          if-no-files-found: warn
